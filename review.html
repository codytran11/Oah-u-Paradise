<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form.html</title>
    <link rel="stylesheet" href="main.css">
    <meta name="description"
        content="This page is for users to submit their own ratings with comments on certain Hawaii islands that will be taken into account and used to create new reviews for other islands.">
    <style>
        .title {
            color: palevioletred;
        }

        #main {
            width: 600px;
            margin-left: auto;
            margin-right: auto;
            font-family: 'Courier New', Courier, monospace
        }

        .form-row {
            margin: 15px 0px;
            display: flex;
            padding-top: 10px;
        }

        .form-col {
            width: 200px;
            text-align: center;
        }

        textarea {
            width: 400px;
            height: 150px;
        }

        #submit-btn {
            background-color: #f8b1c3;
            color: #000;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-family: 'Courier New', Courier, monospace
        }

        .button {
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="navbar">
        <a id="name"> Oah'u Paradise</a>
        <a class="link" href="index.html">Home</a>
        <a class="link" href="destinations.html">Destinations</a>
        <a class="link" href="food.html">Restaurants</a>
        <a class="link" href="review.html">Customer Reviews</a>
    </div>
    <h1 class="title">Customer Reviews</h1>
    <div id="main">

        <form action="confirm.html">
            <div class="form-row">
                <div class="form-col">
                    What island did you visit?
                </div>

                <label>
                    <input type="radio" name="island">
                    Maui
                </label>

                <label>
                    <input type="radio" name="island">
                    Oahu
                </label>

                <label>
                    <input type="radio" name="island">
                    Kauai
                </label>

                <label for="other">Other?</label>
                <input type="text" id="other" name="other">
            </div>

            <div class="form-row">
                <div class="form-col">
                    Rating 1-5
                </div>

                <label>
                    <input type="radio" name="number">
                    1
                </label>

                <label>
                    <input type="radio" name="number">
                    2
                </label>

                <label>
                    <input type="radio" name="number">
                    3
                </label>

                <label>
                    <input type="radio" name="number">
                    4
                </label>

                <label>
                    <input type="radio" name="number">
                    5
                </label>
            </div>

            <div class="form-row">
                <div class="form-col">
                    Comments:
                </div>
                <textarea name="comments" placeholder="Please thoroughly describe your experience here."></textarea>
            </div>

            <div class="button">
                <button id="submit-btn" type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>

</body>

</html>
